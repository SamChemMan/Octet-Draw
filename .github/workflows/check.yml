# Checks on every push and pull request, and before each release (release.yml): the type check, every check file,
# the Rust tests, and the npm and cargo audits (REL-7, REL-26). The smoke test starts the real app on Windows, Linux
# and the Mac and opens a drawing window (src-tauri/src/smoke.rs). The experience check compares this commit with the
# last release, and nothing users had may be lost or made worse (decision 0024). The checks need the release tags.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags, for src/inventory.check.ts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fonts-liberation
      - run: npm ci
      - name: Type check and check files
        run: npm test
      # What an interaction costs in a real browser, which the check files cannot see (scripts/ui-perf.mjs). The
      # machine's own Chrome measures it, headless.
      - name: The window's budgets
        run: node scripts/ui-perf.mjs
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: npm audit
        run: npm audit
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cd src-tauri && cargo audit

  # The last release and this commit, built on one machine and run in headless Chrome (scripts/experience.mjs): each
  # glide still shows and no command is slower, as they are and with the computer 4 times slower.
  experience:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Nothing worse than the last release
        run: node scripts/experience.mjs --out experience-report
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: experience-report
          path: experience-report

  smoke:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - name: Linux libraries for Tauri, and a screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fonts-liberation xvfb
      - run: npm ci
      - name: Build the app with the smoke test
        run: npx tauri build --debug --no-bundle --features smoke
      - name: Start Octet and open a drawing window
        shell: bash
        run: |
          app=src-tauri/target/debug/octet
          # The Mac has no timeout command: Perl's alarm ends the app after 300 seconds there.
          case "$RUNNER_OS" in
            Linux) timeout 300 xvfb-run -a "$app" ;;
            macOS) perl -e 'alarm 300; exec @ARGV' "$app" ;;
            *) timeout 300 "$app" ;;
          esac
