# Installers for macOS (one universal app for Apple silicon and Intel), Windows and Linux (REL-7).
# - A tag such as v1.0.0 makes a draft GitHub release with every installer and the updater's latest.json. The tag
#   must be the version in package.json. The public release has no Feedback box (REL-8).
# - Actions > Release > Run workflow makes a test build: the installers are the run's artifacts, and Feedback is in
#   them unless it is turned off.
# Signing (REL-5, REL-6, REL-10) uses the repository's secrets, listed in docs/release.md. A secret that is not set
# is left out, and the build is not signed in that way: an unsigned build still works, with the system's warning.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      feedback:
        description: Put the Feedback box in the test build
        type: boolean
        default: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Intel runner: GitHub's arm64 Mac runners stopped taking jobs on 26 October 2026 ("not acquired by
          # Runner of type hosted even after multiple attempts"). It builds the same universal app.
          - platform: macos-15-intel
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      OCTET_FEEDBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.feedback && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-cargo-
      - name: Linux libraries for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fonts-liberation
      - run: npm ci

      - name: The tag is the version in package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json has $version."
            exit 1
          fi

      - name: Signing keys that are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # The Tauri CLI signs when a variable is set, even to nothing, so only the secrets that have a value go on.
          names="TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "$RUNNER_OS" = macOS ]; then names="$names APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"; fi
          if [ "$RUNNER_OS" = Windows ]; then names="$names WINDOWS_SIGN_COMMAND AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID"; fi
          for name in $names; do
            if [ -n "${!name}" ]; then
              { echo "$name<<OCTET_SECRET_END"; echo "${!name}"; echo "OCTET_SECRET_END"; } >> "$GITHUB_ENV"
            else
              echo "$name is not set."
            fi
          done

      - name: Windows certificate (a .pfx file)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output "WINDOWS_CERTIFICATE is not set."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "octet.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Windows certificate (Certum SimplySign)
        # Certum keeps the key in its cloud. The one secret is the SimplySign account's email, a space, and the
        # otpauth:// link of its QR code. ssign signs with them: it needs no SimplySign Desktop, and Certum does not
        # make it. It signs .exe and .dll files but not .msi files, and the Windows build makes no .msi.
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTUM: ${{ secrets.WINDOWS_CERTUM }}
        run: |
          if [ -z "$WINDOWS_CERTUM" ]; then echo "WINDOWS_CERTUM is not set."; exit 0; fi
          read -r email otp <<< "$WINDOWS_CERTUM"
          if [ -z "$otp" ]; then echo "::error::WINDOWS_CERTUM must be the email, a space, then the otpauth:// link."; exit 1; fi
          echo "::add-mask::$email"
          echo "::add-mask::$otp"
          { echo "CERTUM_EMAIL=$email"; echo "CERTUM_OTP=$otp"; } >> "$GITHUB_ENV"
          cargo install ssign --version 0.1.11 --locked

      - name: Windows signing tool (Azure Trusted Signing)
        if: runner.os == 'Windows' && startsWith(env.WINDOWS_SIGN_COMMAND, 'trusted-signing-cli')
        run: cargo install trusted-signing-cli --locked

      - name: Build settings
        shell: bash
        run: |
          # Updater files only with the updater key; Windows signing only with a certificate, Certum or a sign command.
          # ssign gets the name that signtool gets from Tauri (/d), for the UAC prompt. The second file is the Windows
          # installer that needs no internet (REL-21): it carries the WebView2 runtime.
          node -e '
            const fs = require("fs"), env = process.env, bundle = {};
            if (env.TAURI_SIGNING_PRIVATE_KEY) bundle.createUpdaterArtifacts = true;
            if (env.WINDOWS_THUMBPRINT) bundle.windows = { certificateThumbprint: env.WINDOWS_THUMBPRINT };
            else if (env.CERTUM_EMAIL) bundle.windows = { signCommand: { cmd: "ssign", args: ["-n", "Octet Draw", "%1"] } };
            else if (env.WINDOWS_SIGN_COMMAND) bundle.windows = { signCommand: env.WINDOWS_SIGN_COMMAND };
            else if (env.RUNNER_OS === "Windows") console.log("::notice::No Windows signing secret is set, so the Windows installers are not signed.");
            fs.writeFileSync("ci-build.conf.json", JSON.stringify({ bundle }));
            fs.writeFileSync("ci-offline.conf.json", JSON.stringify({ bundle: { createUpdaterArtifacts: false, windows: { webviewInstallMode: { type: "offlineInstaller", silent: true } } } }));
          '
          node scripts/licences.mjs

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A test build (Run workflow) names no release, so the action makes none.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && 'Octet Draw __VERSION__' || '' }}
          releaseBody: ${{ github.event_name == 'push' && 'Download the installer for your computer below.' || '' }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }} --config ci-build.conf.json

      - name: Notarise the disk image
        # Tauri notarises the app but not the .dmg around it, and macOS can block a signed .dmg that is not notarised.
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          # Apple's ticket server (api.apple-cloudkit.com) sometimes drops the connection, so stapling is tried six
          # times. The .dmg is notarised either way; without its ticket stapled, macOS checks it online on first open.
          for try in 1 2 3 4 5 6; do
            if xcrun stapler staple "$dmg"; then break; fi
            if [ "$try" = 6 ]; then echo "::warning::Stapling failed six times; the notarised .dmg goes up without its ticket."; break; fi
            sleep 30
          done
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            name=$(basename "$dmg" | tr ' ' '.')
            cp "$dmg" "$RUNNER_TEMP/$name"
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$name" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Clear the first Windows installers, which are uploaded
        if: runner.os == 'Windows'
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.tauri.outputs.releaseId }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          releaseAssetNamePattern: "[name]_[version]_[arch]-offline[setup][ext]"
          workflowArtifactNamePattern: "[platform]-[arch]-[bundle]-offline"
          args: --bundles nsis --config ci-build.conf.json --config ci-offline.conf.json

  stable-names:
    # Copies of the installers under names that never change, so the website's links to
    # releases/latest/download/<name> always give the newest published version.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Upload Octet-Draw-mac.dmg, Octet-Draw-windows.exe and Octet-Draw-linux.AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out --pattern '*.dmg' --pattern '*-setup.exe' --pattern '*.AppImage'
          copy() {
            local f
            f=$(ls out | grep -E "$1" | grep -v -- '-offline' | head -n 1 || true)
            if [ -z "$f" ]; then echo "No installer matches $1"; exit 1; fi
            cp "out/$f" "$2"
            gh release upload "$TAG" "$2" --repo "$GITHUB_REPOSITORY" --clobber
          }
          copy '_universal\.dmg$' Octet-Draw-mac.dmg
          copy '_x64-setup\.exe$' Octet-Draw-windows.exe
          copy '_amd64\.AppImage$' Octet-Draw-linux.AppImage
