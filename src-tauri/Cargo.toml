[package]
name = "octet"
# No version here: Octet's one version is in package.json, which tauri.conf.json reads (REL-9).
description = "A chemical structure drawing editor"
authors = ["Sam Ellis"]
license = "Apache-2.0"
repository = "https://github.com/SamChemMan/Octet-Draw"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# The recent drawings list (already in the build through Tauri).
serde_json = "1"
# Export and the clipboard picture: SVG to a vector PDF with subset fonts (svg2pdf, pdf-writer), SVG to PNG (resvg).
svg2pdf = "0.13"
pdf-writer = "0.12"
resvg = { version = "0.45", default-features = false, features = ["text"] }
miniz_oxide = "0.8"
png = "0.17"
# JPEG and GIF export (its encoders; svg2pdf already builds it with these features).
image = { version = "0.25", default-features = false, features = ["jpeg", "gif"] }
base64 = "0.22"
# Opens web addresses and files in the user's own programs. On Windows it calls ShellExecuteExW, not cmd.exe.
open = { version = "5.4", features = ["shellexecute-on-windows"] }

# Updates, only when the user allows them or asks (decision 0010). The download is signed and checked against the
# public key in tauri.conf.json. Not the "zip" feature: Octet's updates are not zip files.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Name to Structure's PubChem step (src/pubchem.rs, decision 0015): the updater's own HTTPS client and TLS, with the
# same features, so nothing new is built.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# A second launch on Windows and Linux gives its files to the Octet that runs (src/open.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Copy and paste on Windows: the clipboard calls (src/clipboard_windows.rs). Alt and a menu's access key, from the web
# view to the menu bar (src/access_keys.rs): WebView2's own interface. Both already in the build through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"
# Octet Drawing objects in Office (src/ole_windows.rs, decision 0023): Microsoft's COM bindings and the #[implement]
# macro for the server's interfaces (IOleObject, IDataObject, IPersistStorage, IClassFactory), the OLE clipboard and
# the registry (Win32_Security for its calls; Win32_Media_Audio is where the bindings put IMessageFilter). MIT or
# Apache-2.0. The same versions are already in the build through webview2-com.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

# Copy and paste on Linux: GTK's clipboard (src/clipboard_linux.rs). Already in the build through Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Quit from the Dock answers AppKit on the main queue (src/quit.rs). Already used by Tauri's dialogs (rfd).
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSDictionary", "NSError", "NSPathUtilities", "NSURL"] }
# The eyedropper (src/eyedropper.rs): the system's colour sampler (NSColorSampler, NSColor, NSColorSpace, block2), in
# the same crate. Edit Picture from Word (src/word.rs): NSBeep (NSGraphics) and whether Word runs (NSRunningApplication);
# double-click in Word: the global mouse monitor (NSEvent) and the program in front (NSWorkspace).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSResponder", "NSView", "NSApplication", "NSGraphics", "NSRunningApplication", "NSEvent", "NSWorkspace", "NSColor", "NSColorSampler", "NSColorSpace", "block2", "objc2-core-foundation"] }
# Feedback's picture of the window (WKWebView's own snapshot). Already used by Tauri.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKSnapshotConfiguration"] }
block2 = "0.6"

# https://tauri.app/concept/size/#cargo-configuration
[features]
# The smoke test of the real app (src/smoke.rs, check.yml). Never in an installer.
smoke = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
