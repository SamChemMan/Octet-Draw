[package]
name = "octet"
version = "0.1.0"
description = "A chemical structure drawing editor"
authors = ["Sam Ellis"]
license = "Apache-2.0"
repository = "https://github.com/SamChemMan/Octet"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
