[package]
name = "octet"
version = "0.1.0"
description = "A chemical structure drawing editor"
authors = ["Sam Ellis"]
license = "Apache-2.0"
repository = "https://github.com/SamChemMan/Octet"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# The recent drawings list (already in the build through Tauri).
serde_json = "1"
# Export and the clipboard picture: SVG to a vector PDF with subset fonts (svg2pdf, pdf-writer), SVG to PNG (resvg).
svg2pdf = "0.13"
pdf-writer = "0.12"
resvg = { version = "0.45", default-features = false, features = ["text"] }
miniz_oxide = "0.8"
png = "0.17"
base64 = "0.22"

# A second launch on Windows and Linux gives its files to the Octet that runs (src/open.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSDictionary", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSResponder", "NSView"] }
# Feedback's picture of the window (WKWebView's own snapshot). Already used by Tauri.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKSnapshotConfiguration"] }
block2 = "0.6"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
